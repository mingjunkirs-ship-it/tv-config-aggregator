[project]
name = "tv-config-aggregator"
version = "1.0.0"
description = "Merge and periodically refresh TVBox/影视仓 configuration sources"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "httpx>=0.27,<1",
  "uvicorn[standard]>=0.29,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
