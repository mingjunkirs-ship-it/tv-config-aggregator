name: Update TV configuration

on:
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC: 00:23, 06:23, 12:23 and 18:23 UTC every day.
    - cron: "23 */6 * * *"
  push:
    branches: [main]
    paths:
      - "sources.json"
      - "scripts/**"
      - "tv_aggregator/**"
      - "requirements.txt"
      - ".github/workflows/update-config.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore previous successful source snapshots
        uses: actions/cache@v4
        with:
          path: data/tv.sqlite3
          key: tv-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            tv-db-${{ runner.os }}-

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

      - name: Fetch, merge and generate static API
        run: python -m scripts.build_static --output dist

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
